<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1920, user-scalable=no" />
  <title>MPX Player</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #root { position: relative; z-index: 1; display: flex; flex-direction: column; width: 100%; height: 100%; }
    :focus { outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // un error al arrancar se ve en pantalla (sin esto el televisor queda en negro)
    window.onerror = function (msg, url, line) {
      var d = document.getElementById('err-log') || document.createElement('div');
      d.id = 'err-log';
      d.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;padding:20px;background:#900;color:#fff;font-family:sans-serif;font-size:22px;z-index:999999;border-radius:8px;';
      d.textContent = 'Error en la app: ' + msg + (line ? ' (l\u00ednea ' + line + ')' : '');
      document.body.appendChild(d);
    };
  </script>
  <script src="app.js" onerror="window.onerror('No se encontr\u00f3 app.js: compila con npm run build y abre la carpeta dist/.', '', 0)"></script>
</body>
</html>
