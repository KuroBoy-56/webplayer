name: APK Android TV

on:
  push:
    branches: [android-tv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # la llave maestra no va en el código: el secreto PANEL_MASTER_KEY se escribe en local.properties solo durante la compilación
      - name: Configurar panel
        env:
          PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY }}
          AMAZON_CERT_SHA256: ${{ secrets.AMAZON_CERT_SHA256 }}
        run: |
          : > local.properties
          if [ -n "$PANEL_MASTER_KEY" ]; then echo "panel.master_key=$PANEL_MASTER_KEY" >> local.properties; else echo "::warning::Falta el secreto PANEL_MASTER_KEY: la activación no funcionará"; fi
          if [ -n "$AMAZON_CERT_SHA256" ]; then echo "amazon.cert_sha256=$AMAZON_CERT_SHA256" >> local.properties; fi

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
      # resumen de errores como anotación (visible sin descargar el registro completo)
      - name: Resumen de errores
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not (resolve|find)|> " build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::$msg"

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk LatMpx-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LatMpx-TV-apk
          path: LatMpx-TV.apk

      # publica siempre la última versión en la misma dirección de descarga (Releases > apk-tv-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-tv-latest --yes --cleanup-tag || true
          gh release create apk-tv-latest LatMpx-TV.apk --target "$GITHUB_SHA" --title "LatMpx TV APK (última versión)" --notes "Compilado automáticamente desde la rama android-tv ($GITHUB_SHA). Solo para Android TV / Google TV / TV Box." --prerelease
