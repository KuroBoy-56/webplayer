name: APK Android

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # la dirección del panel no va en el código: se guarda como secreto PANEL_URL del repositorio
      - name: Configurar panel
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
        run: |
          if [ -n "$PANEL_URL" ]; then echo "panel.url=$PANEL_URL" > local.properties; fi

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
      # resumen de errores como anotación (visible sin descargar el registro completo)
      - name: Resumen de errores
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not (resolve|find)|> " build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::$msg"

      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk LatMpx.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LatMpx-apk
          path: LatMpx.apk

      # publica siempre la última versión en la misma dirección de descarga (Releases > apk-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest LatMpx.apk --target "$GITHUB_SHA" --title "LatMpx APK (última versión)" --notes "Compilado automáticamente desde la rama android ($GITHUB_SHA)." --prerelease
