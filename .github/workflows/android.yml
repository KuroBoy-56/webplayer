name: AAB Google Play (Android (celular y tablet))

on:
  push:
    branches: [play-store]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # la llave maestra y la llave de subida de Google Play no van en el código: los secretos se escriben en
      # local.properties (y la llave en un archivo temporal) solo durante la compilación
      - name: Configurar panel y llave de subida
        env:
          PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY }}
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          : > local.properties
          if [ -n "$PANEL_MASTER_KEY" ]; then echo "panel.master_key=$PANEL_MASTER_KEY" >> local.properties; else echo "::warning::Falta el secreto PANEL_MASTER_KEY: la activación no funcionará"; fi
          if [ -n "$PLAY_UPLOAD_KEYSTORE" ]; then
            echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "upload.store_file=$RUNNER_TEMP/upload.jks"
              echo "upload.store_password=$PLAY_UPLOAD_STORE_PASSWORD"
              echo "upload.key_alias=$PLAY_UPLOAD_KEY_ALIAS"
              echo "upload.key_password=$PLAY_UPLOAD_KEY_PASSWORD"
            } >> local.properties
          else
            echo "::warning::Falta el secreto PLAY_UPLOAD_KEYSTORE: el .aab sale firmado con la llave de depuración y Google Play no lo acepta"
          fi

      # Google Play pide el paquete .aab (Android App Bundle), no el APK
      - name: Compilar AAB
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon bundleRelease 2>&1 | tee build.log
      # resumen de errores como anotación (visible sin descargar el registro completo)
      - name: Resumen de errores
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not (resolve|find)|> " build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%0A", $0}')
          echo "::error title=Errores de compilación::$msg"

      - name: Renombrar
        run: cp app/build/outputs/bundle/release/app-release.aab MPX-Player.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MPX-Player-aab
          path: MPX-Player.aab

      # la última versión en la misma dirección (Releases > aab-play-latest), para subirla a Google Play Console
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aab-play-latest --yes --cleanup-tag || true
          gh release create aab-play-latest MPX-Player.aab --target "$GITHUB_SHA" --title "MPX Player Android (celular y tablet) para Google Play (última versión)" --notes "Paquete .aab para subir a Google Play Console. Compilado automáticamente desde la rama play-store ($GITHUB_SHA)." --prerelease
