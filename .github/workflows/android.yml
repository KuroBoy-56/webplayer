name: APK Android TV (tiendas)

on:
  push:
    branches: [android-tv-sin-certificado]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # la llave maestra y la llave de subida de las tiendas no van en el código: los secretos se escriben en
      # local.properties (y la llave en un archivo temporal) solo durante la compilación
      - name: Configurar panel y llave de subida
        env:
          PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY }}
          PLAY_UPLOAD_KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          : > local.properties
          if [ -n "$PANEL_MASTER_KEY" ]; then echo "panel.master_key=$PANEL_MASTER_KEY" >> local.properties; else echo "::warning::Falta el secreto PANEL_MASTER_KEY: la activación no funcionará"; fi
          if [ -n "$PLAY_UPLOAD_KEYSTORE" ]; then
            echo "$PLAY_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "upload.store_file=$RUNNER_TEMP/upload.jks"
              echo "upload.store_password=$PLAY_UPLOAD_STORE_PASSWORD"
              echo "upload.key_alias=$PLAY_UPLOAD_KEY_ALIAS"
              echo "upload.key_password=$PLAY_UPLOAD_KEY_PASSWORD"
            } >> local.properties
          else
            echo "::warning::Falta el secreto PLAY_UPLOAD_KEYSTORE: el .aab sale firmado con la llave de depuración y las tiendas no lo aceptan"
          fi

      - name: Compilar APK y AAB
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          # el paquete .aab (Google Play / Amazon) con la llave de subida; el APK de arriba sigue firmado como siempre
          ./gradlew --no-daemon bundleRelease -Pmpx.upload=true 2>&1 | tee -a build.log
      # resumen de errores como anotación (visible sin descargar el registro completo)
      - name: Resumen de errores
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not (resolve|find)|> " build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::$msg"

      - name: Renombrar
        run: |
          cp app/build/outputs/apk/release/app-release.apk LatMpx-TV.apk
          cp app/build/outputs/bundle/release/app-release.aab MPX-Player-TV-tienda.aab

      - uses: actions/upload-artifact@v4
        with:
          name: LatMpx-TV-apk
          path: LatMpx-TV.apk

      # publica siempre la última versión en la misma dirección de descarga (Releases > apk-tv-tienda-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-tv-tienda-latest --yes --cleanup-tag || true
          gh release create apk-tv-tienda-latest LatMpx-TV.apk --target "$GITHUB_SHA" --title "LatMpx TV APK para tiendas (última versión)" --notes "Para publicar en tiendas (sin comprobar la firma). Compilado automáticamente desde la rama android-tv-sin-certificado ($GITHUB_SHA). Solo para Android TV / Google TV / TV Box." --prerelease

      - uses: actions/upload-artifact@v4
        with:
          name: MPX-Player-TV-tienda-aab
          path: MPX-Player-TV-tienda.aab

      # el .aab en su propia dirección (Releases > aab-tv-tienda-latest), para subirlo a Google Play Console o a Amazon
      - name: Publicar AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete aab-tv-tienda-latest --yes --cleanup-tag || true
          gh release create aab-tv-tienda-latest MPX-Player-TV-tienda.aab --target "$GITHUB_SHA" --title "MPX Player Android TV para tiendas, paquete AAB (última versión)" --notes "Paquete .aab para las tiendas (firmado con la llave de subida). Compilado automáticamente desde la rama android-tv-sin-certificado ($GITHUB_SHA)." --prerelease
