name: App webOS (LG)

on:
  push:
    branches: [webOS]
  workflow_dispatch:

permissions:
  contents: write

env:
  # llave del panel para Autodemo, DNS y registro del equipo (la misma de Vega OS, Tizen e iOS; ver config/README.md)
  PANEL_KEY: ${{ secrets.PANEL_KEY || secrets.PANEL_MASTER_KEY }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar paquetes
        run: npm ci --no-audit --no-fund

      - name: Llave del panel
        run: |
          node tools/prepare-key.js | tee key.log
          grep -q incluida key.log || echo "::notice::Compilado sin llave del panel: sin Autodemo, DNS ni registro del equipo (ver config/README.md)"

      - name: Revisar código (TypeScript) y pruebas
        run: |
          npm run typecheck
          npm test

      - name: Compilar la app (dist/)
        run: npm run build

      # CLI oficial de LG (ares-package): arma el .ipk que se instala con Developer Mode o ares-install
      - name: Empaquetar .ipk
        run: |
          npm i -g --no-audit --no-fund @webos-tools/cli@3.2.6
          mkdir -p out
          ares-package -o out dist
          cp out/*.ipk out/MPXPlayer.ipk
          cd dist && zip -qr ../out/MPXPlayer-web.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: MPXPlayer-webOS
          path: out/*

      # publica siempre la última versión en la misma dirección de descarga (Releases > webos-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum MPXPlayer.ipk MPXPlayer-web.zip > SHA256SUMS.txt
          gh release delete webos-latest --yes --cleanup-tag || true
          gh release create webos-latest MPXPlayer.ipk MPXPlayer-web.zip SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease \
            --title "MPX Player LG Smart TV · webOS (última versión)" \
            --notes "Compilado automáticamente desde la rama webOS ($GITHUB_SHA). Se instala con la app Developer Mode de LG y ares-install (ver el README de la rama webOS)."
