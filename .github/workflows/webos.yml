name: App webOS (LG)

on:
  push:
    branches: [webOS]
  workflow_dispatch:

permissions:
  contents: write

env:
  # llave del panel para Autodemo, DNS y registro del equipo (la misma de Vega OS, Tizen e iOS; ver config/README.md)
  PANEL_KEY: ${{ secrets.PANEL_KEY || secrets.PANEL_MASTER_KEY }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar paquetes
        run: npm ci --no-audit --no-fund

      - name: Llave del panel
        run: |
          node tools/prepare-key.js | tee key.log
          grep -q incluida key.log || echo "::notice::Compilado sin llave del panel: sin Autodemo, DNS ni registro del equipo (ver config/README.md)"

      - name: Revisar código (TypeScript) y pruebas
        run: |
          npm run typecheck
          npm test

      - name: Compilar la app (dist/ Full HD 1920x1080 y dist-hd/ HD 1280x720)
        run: |
          npm run build
          npm run build:hd

      # CLI oficial de LG (ares-package): arma el .ipk que se instala con Developer Mode o ares-install
      - name: Empaquetar .ipk
        run: |
          npm i -g --no-audit --no-fund @webos-tools/cli@3.2.6
          mkdir -p out out-hd pkg pkg-hd
          ares-package -o pkg dist
          cp pkg/*.ipk out/MPXPlayer.ipk
          (cd dist && zip -qr ../out/MPXPlayer-web.zip .)
          # versión HD (1280x720): mismo id y versión, appinfo.json con "resolution": "1280x720"
          ares-package -o pkg-hd dist-hd
          cp pkg-hd/*.ipk out-hd/MPXPlayer-HD.ipk
          (cd dist-hd && zip -qr ../out-hd/MPXPlayer-HD-web.zip .)
          grep -q '"resolution": "1280x720"' dist-hd/appinfo.json

      - uses: actions/upload-artifact@v4
        with:
          name: MPXPlayer-webOS
          path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: MPXPlayer-webOS-HD-1280x720
          path: out-hd/*

      # publica siempre la última versión en la misma dirección de descarga (Releases > webos-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum MPXPlayer.ipk MPXPlayer-web.zip > SHA256SUMS.txt
          gh release delete webos-latest --yes --cleanup-tag || true
          gh release create webos-latest MPXPlayer.ipk MPXPlayer-web.zip SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease \
            --title "MPX Player LG Smart TV · webOS Full HD 1920x1080 (última versión)" \
            --notes "Compilado automáticamente desde la rama webOS ($GITHUB_SHA). Se instala con la app Developer Mode de LG y ares-install (ver el README de la rama webOS)."
          cd ../out-hd
          sha256sum MPXPlayer-HD.ipk MPXPlayer-HD-web.zip > SHA256SUMS.txt
          gh release delete webos-hd-latest --yes --cleanup-tag || true
          gh release create webos-hd-latest MPXPlayer-HD.ipk MPXPlayer-HD-web.zip SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease \
            --title "MPX Player LG Smart TV · webOS HD 1280x720 (última versión)" \
            --notes "Versión HD (resolución 1280x720) para los televisores LG HD. Compilada automáticamente desde la rama webOS ($GITHUB_SHA), junto con la Full HD (Releases > webos-latest). Misma app (com.mpxplayer.app) y misma versión."
