name: App Vega OS (Fire TV)

on:
  push:
    branches: [vega-os]
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Versión del SDK de Vega (vacío = la fijada abajo)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # SDK de Vega fijado; si Amazon lo retira se prueba con la última versión
  VEGA_SDK_PINNED: '0.24.12112'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 jq tar curl ca-certificates

      # el instalador oficial de Amazon no pide cuenta ni llaves
      - name: Instalar SDK de Vega
        env:
          NONINTERACTIVE: 'true'
          SKIP_VVD_INSTALL: 'true'
        run: |
          set -o pipefail
          want="${{ github.event.inputs.sdk_version }}"
          [ -z "$want" ] && want="$VEGA_SDK_PINNED"
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o "$RUNNER_TEMP/get_vvm.sh"
          if ! VEGA_SDK_VERSION="$want" bash "$RUNNER_TEMP/get_vvm.sh" 2>&1 | tee sdk.log; then
            echo "::warning::No se pudo instalar el SDK $want; se instala la última versión"
            bash "$RUNNER_TEMP/get_vvm.sh" 2>&1 | tee sdk.log
          fi
          [ -f "$HOME/vega/env" ] && cat "$HOME/vega/env"
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Instalar paquetes
        run: npm ci --no-audit --no-fund

      - name: Revisar código (TypeScript)
        run: npm run typecheck

      - name: Compilar .vpkg
        run: |
          set -o pipefail
          [ -f "$HOME/vega/env" ] && source "$HOME/vega/env"
          vega --version || true
          # Vega falla con espacios en la ruta: se compila en una copia limpia
          mkdir -p "$RUNNER_TEMP/app"
          rsync -a --exclude .git ./ "$RUNNER_TEMP/app/"
          cd "$RUNNER_TEMP/app"
          npx react-native build-vega --build-type Release --build-number "${{ github.run_number }}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . -name '*.vpkg' -not -path './node_modules/*' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"
          test -n "$(ls "$GITHUB_WORKSPACE/out"/*.vpkg 2>/dev/null)"

      - name: Validar .vpkg
        continue-on-error: true
        run: |
          [ -f "$HOME/vega/env" ] && source "$HOME/vega/env"
          for f in out/*.vpkg; do vega exec vpt validate "$f" || true; done

      # resumen de errores como anotación (visible sin descargar el registro completo)
      - name: Resumen de errores
        if: failure()
        run: |
          f=build.log; [ -f "$f" ] || f=sdk.log
          [ -f "$f" ] || exit 0
          msg=$(grep -iE "error|failed|cannot|not found" "$f" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: LatMpx-Vega-vpkg
          path: out/*.vpkg

      # publica siempre la última versión en la misma dirección de descarga (Releases > vega-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum *.vpkg > SHA256SUMS.txt
          gh release delete vega-latest --yes --cleanup-tag || true
          gh release create vega-latest *.vpkg SHA256SUMS.txt --target "$GITHUB_SHA" --title "LatMpx TV+ Vega OS (última versión)" --notes "Compilado automáticamente desde la rama vega-os ($GITHUB_SHA). Paquetes .vpkg para Fire TV con Vega OS: armv7 (Fire TV Stick 4K Select) y aarch64. Súbelos en la Amazon Appstore Developer Console." --prerelease
