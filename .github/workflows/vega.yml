name: App Vega OS (Fire TV)

on:
  push:
    branches: [vega-os]
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 'Versión del SDK de Vega (vacío = la fijada abajo)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # llave del panel para Autodemo y registro del equipo (opcional; ver config/README.md)
  PANEL_KEY: ${{ secrets.PANEL_KEY || secrets.PANEL_MASTER_KEY }}
  # SDK de Vega: vacío = la última versión (SDK 2.0, para Vega OS 2.0: http en el reproductor de Vega en modo directo).
  # Para fijar una versión, ponerla aquí (antes 0.24.12112, Vega OS 1.2)
  VEGA_SDK_PINNED: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 jq tar curl ca-certificates

      # Copia del SDK de Vega guardada en GitHub (actions/cache, 2.8.0). El instalador de Amazon a veces no contesta (25 de
      # noviembre de 2026: «401 Unauthorized» durante horas) y sin el SDK no se compila nada. Se recupera en cada
      # compilación (así GitHub no la borra: borra las que no se usan en 7 días) y se renueva cuando Amazon entrega una
      # versión nueva; si Amazon no contesta, se compila con la copia
      - name: SDK de Vega guardado
        id: saved
        uses: actions/cache/restore@v4
        with:
          path: ~/vega-saved
          key: vega-sdk-v1-${{ github.run_id }}
          restore-keys: vega-sdk-v1-

      # el instalador oficial de Amazon no pide cuenta ni llaves (hasta 3 intentos)
      - name: Instalar SDK de Vega
        id: sdk
        continue-on-error: true
        env:
          NONINTERACTIVE: 'true'
          SKIP_VVD_INSTALL: 'true'
        run: |
          set -o pipefail
          want="${{ github.event.inputs.sdk_version }}"
          [ -z "$want" ] && want="$VEGA_SDK_PINNED"
          ok=0
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && sleep 30
            curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o "$RUNNER_TEMP/get_vvm.sh" || continue
            if VEGA_SDK_VERSION="$want" bash "$RUNNER_TEMP/get_vvm.sh" 2>&1 | tee sdk.log; then ok=1; break; fi
            if [ -n "$want" ]; then
              echo "::warning::No se pudo instalar el SDK $want; se instala la última versión"
              if bash "$RUNNER_TEMP/get_vvm.sh" 2>&1 | tee sdk.log; then ok=1; break; fi
            fi
          done
          [ "$ok" = 1 ] || exit 1
          ver=$(sed -n 's#.*vega-sdk/main/\([0-9][0-9.]*\).*#\1#p' "$HOME/vega/env" | head -1)
          echo "ver=${ver:-desconocida}" >> "$GITHUB_OUTPUT"

      # Amazon entregó el SDK: la copia se renueva si es otra versión que la guardada
      - name: Preparar copia nueva del SDK
        id: fresh
        if: steps.sdk.outcome == 'success'
        run: |
          old=$(sed -n 's#.*vega-sdk/main/\([0-9][0-9.]*\).*#\1#p' "$HOME/vega-saved/env" 2>/dev/null | head -1)
          if [ "$old" != "${{ steps.sdk.outputs.ver }}" ]; then
            rm -rf "$HOME/vega-saved" && cp -a "$HOME/vega" "$HOME/vega-saved"
            echo "save=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar copia del SDK
        if: steps.fresh.outputs.save == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/vega-saved
          key: vega-sdk-v1-${{ steps.sdk.outputs.ver }}

      # Amazon no contestó: se compila con la copia guardada (si todavía no hay ninguna, no se puede compilar)
      - name: Usar la copia guardada del SDK
        if: steps.sdk.outcome != 'success'
        run: |
          if [ ! -f "$HOME/vega-saved/env" ]; then
            echo "::error::Amazon no entregó el SDK de Vega y todavía no hay una copia guardada"
            exit 1
          fi
          echo "::warning::Amazon no entregó el SDK de Vega: se compila con la copia guardada"
          rm -rf "$HOME/vega" && cp -a "$HOME/vega-saved" "$HOME/vega"

      - name: Ruta del SDK
        run: |
          [ -f "$HOME/vega/env" ] && cat "$HOME/vega/env"
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"

      - name: Instalar paquetes
        run: npm ci --no-audit --no-fund

      - name: Llave del panel
        run: |
          node tools/prepare-key.js | tee key.log
          grep -q incluida key.log || echo "::notice::Compilado sin llave del panel: sin Autodemo ni registro del equipo (ver config/README.md)"

      - name: Revisar código (TypeScript)
        run: npm run typecheck

      - name: Compilar .vpkg
        run: |
          set -o pipefail
          [ -f "$HOME/vega/env" ] && source "$HOME/vega/env"
          vega --version || true
          # Vega falla con espacios en la ruta: se compila en una copia limpia
          mkdir -p "$RUNNER_TEMP/app"
          rsync -a --exclude .git ./ "$RUNNER_TEMP/app/"
          cd "$RUNNER_TEMP/app"
          npx react-native build-vega --build-type Release --build-number "${{ github.run_number }}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . -name '*.vpkg' -not -path './node_modules/*' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -la "$GITHUB_WORKSPACE/out"
          test -n "$(ls "$GITHUB_WORKSPACE/out"/*.vpkg 2>/dev/null)"

      - name: Validar .vpkg
        continue-on-error: true
        run: |
          [ -f "$HOME/vega/env" ] && source "$HOME/vega/env"
          for f in out/*.vpkg; do vega exec vpt validate "$f" || true; done

      # resumen de errores como anotación (visible sin descargar el registro completo)
      - name: Resumen de errores
        if: failure()
        run: |
          f=build.log; [ -f "$f" ] || f=sdk.log
          [ -f "$f" ] || exit 0
          msg=$(grep -iE "error|failed|cannot|not found" "$f" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: LatMpx-Vega-vpkg
          path: out/*.vpkg

      # publica siempre la última versión en la misma dirección de descarga (Releases > vega-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum *.vpkg > SHA256SUMS.txt
          gh release delete vega-latest --yes --cleanup-tag || true
          gh release create vega-latest *.vpkg SHA256SUMS.txt --target "$GITHUB_SHA" --title "MPX Player Vega OS (última versión)" --notes "Compilado automáticamente desde la rama vega-os ($GITHUB_SHA). Para la tienda sube armv7 y aarch64; x86_64 es solo para el simulador. Súbelos en la Amazon Appstore Developer Console." --prerelease
