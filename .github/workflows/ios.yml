name: IPA iOS

# App de iPhone / iPad. Se compila sin firma: el .ipa se instala con Sideloadly o AltStore,
# que lo firman con tu Apple ID (ver README). Publica siempre en Releases > ipa-latest.

on:
  push:
    branches: [ios]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      # la llave maestra no va en el código: el secreto PANEL_MASTER_KEY se escribe solo durante la compilación
      - name: Configurar panel
        env:
          PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY || secrets.PANEL_KEY }}
        run: |
          if [ -z "$PANEL_MASTER_KEY" ]; then echo "::warning::Falta el secreto PANEL_MASTER_KEY: la activación no funcionará"; fi
          sh tools/write-panel-key.sh

      - name: Generar proyecto
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          pod install --repo-update

      - name: Compilar
        run: |
          status=0
          xcodebuild -workspace LatMpx.xcworkspace -scheme LatMpx -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150 || true
          exit $status

      - name: Resumen de errores
        if: failure()
        run: |
          msg=$(grep -E "error:" build.log | sort -u | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de compilación::$msg"

      - name: Empaquetar .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          test -f "$APP/LatMpx"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          APP="Payload/$(basename "$APP")"
          # Sideloadly / AltStore solo reemplazan una firma que ya existe: sin firma fallan con
          # "macho sign/edit failed". Se firma ad hoc (sin certificado) el framework y la app,
          # y VLCKit se deja solo con arm64 (sin encabezado "fat").
          for f in "$APP"/Frameworks/*.framework; do
            bin="$f/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$f/Info.plist")"
            if lipo -info "$bin" | grep -q "Architectures in the fat file"; then lipo "$bin" -thin arm64 -output "$bin.thin" && mv "$bin.thin" "$bin"; fi
            codesign --force --sign - --timestamp=none "$f"
          done
          # sello de integridad del código (LatMpx/App/Integrity.swift); antes de firmar para que quede sellado
          python3 tools/seal.py write "$APP/LatMpx" "$APP/ic.bin"
          codesign --force --sign - --timestamp=none --generate-entitlement-der "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          python3 tools/seal.py check "$APP/LatMpx" "$APP/ic.bin"
          codesign -dv "$APP/Frameworks/MobileVLCKit.framework" 2>&1 | grep -E "Signature|Format"
          zip -qry LatMpx.ipa Payload
          ls -la LatMpx.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LatMpx-ipa
          path: LatMpx.ipa

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # la versión que ya estaba publicada se guarda una sola vez como respaldo (ipa-anterior) y no se toca después
          if ! gh release view ipa-anterior >/dev/null 2>&1 && gh release download ipa-latest -p LatMpx.ipa -O anterior.ipa; then
            gh release create ipa-anterior anterior.ipa --title "MPX Player iPhone / iPad (versión anterior, respaldo)" \
              --notes "La versión que estaba publicada antes de la 1.0.1. Si la nueva falla, instala esta." --prerelease
          fi
          # cada compilación queda también con su número de versión (no se borra)
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/*.app/Info.plist)
          gh release create "ipa-$VER-${GITHUB_SHA::7}" LatMpx.ipa --target "$GITHUB_SHA" --title "MPX Player iPhone / iPad $VER (${GITHUB_SHA::7})" \
            --notes "Compilado desde la rama ios ($GITHUB_SHA)." --prerelease || true
          gh release delete ipa-latest --yes --cleanup-tag || true
          gh release create ipa-latest LatMpx.ipa --target "$GITHUB_SHA" --title "MPX Player iPhone / iPad (última versión)" \
            --notes "Compilado automáticamente desde la rama ios ($GITHUB_SHA). Sin firma: instálalo con Sideloadly o AltStore (ver README de la rama ios)." --prerelease

  # prueba de humo: la app abre en el simulador de iPhone sin cerrarse (captura de pantalla como artefacto)
  smoke:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generar proyecto
        env:
          PANEL_MASTER_KEY: ${{ secrets.PANEL_MASTER_KEY || secrets.PANEL_KEY }}
        run: |
          sh tools/write-panel-key.sh
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          pod install --repo-update
      - name: Compilar para el simulador
        run: |
          status=0
          xcodebuild -workspace LatMpx.xcworkspace -scheme LatMpx -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" sim.log | sort -u | head -80 || true
          exit $status
      - name: Abrir en el simulador
        run: |
          set -x
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.latmpx.player
          sleep 25
          xcrun simctl io "$DEV" screenshot shot1.png
          # sigue abierta (no se cerró al iniciar)
          xcrun simctl spawn "$DEV" launchctl list | grep -i latmpx
          sleep 20
          xcrun simctl io "$DEV" screenshot shot2.png
          # inicio de sesión (como si se hubiera elegido Omitir en el distribuidor)
          xcrun simctl terminate "$DEV" com.latmpx.player || true
          xcrun simctl launch "$DEV" com.latmpx.player -dist_choice skip
          sleep 30
          xcrun simctl io "$DEV" screenshot shot3.png
          # iPad
          PAD=$(xcrun simctl list devices available | grep -E "iPad Pro|iPad Air" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -n "$PAD" ]; then
            xcrun simctl boot "$PAD" || true
            xcrun simctl bootstatus "$PAD" -b
            xcrun simctl install "$PAD" "$APP"
            xcrun simctl launch "$PAD" com.latmpx.player -dist_choice skip
            sleep 30
            xcrun simctl io "$PAD" screenshot shot4.png
          fi
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "LatMpx"' --style compact 2>/dev/null | grep -iE "fault|crash|error" | head -40 || true
      - name: Probar el reproductor (abrir, pausar, adelantar, salir)
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$DEV"
          mkdir -p uishots
          status=0
          TEST_RUNNER_SHOTS="$PWD/uishots" xcodebuild -workspace LatMpx.xcworkspace -scheme LatMpx -configuration Debug \
            -sdk iphonesimulator -destination "id=$DEV" -derivedDataPath build -resultBundlePath uitest.xcresult \
            CODE_SIGNING_ALLOWED=NO test > uitest.log 2>&1 || status=$?
          grep -E "error:|Test Case|XCTAssert|failed|passed|TIEMPO|TEST (SUCCEEDED|FAILED)" uitest.log | head -80 || true
          grep -E "Wait for .* to idle|Tap .* (Button|Coordinate)|Checking existence" uitest.log | head -60 || true
          for f in uishots/diag-*.txt; do echo "== $f"; cat "$f"; done 2>/dev/null || true
          xcrun xcresulttool export attachments --path uitest.xcresult --output-path uishots >/dev/null 2>&1 || true
          ls uishots || true
          exit $status
      - name: Publicar capturas del simulador
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shot*.png uishots/*.png >/dev/null 2>&1 || exit 0
          gh release delete simulador-capturas --yes --cleanup-tag || true
          gh release create simulador-capturas shot*.png uishots/[0-9]*.png --target "$GITHUB_SHA" --prerelease \
            --title "Capturas del simulador (prueba automática)" --notes "Pantallas de la prueba del simulador de la rama ios ($GITHUB_SHA). No es una versión para instalar." || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-simulador
          path: |
            shot*.png
            uishots/
            uitest.log
