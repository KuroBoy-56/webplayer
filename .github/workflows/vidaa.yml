name: App VIDAA (Hisense)

on:
  push:
    branches: [vidaaOS]
  workflow_dispatch:

permissions:
  contents: write

env:
  # llave del panel para Autodemo, DNS y registro del equipo (la misma de webOS, Tizen, Vega OS e iOS; ver config/README.md)
  PANEL_KEY: ${{ secrets.PANEL_KEY || secrets.PANEL_MASTER_KEY }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar paquetes
        run: npm ci --no-audit --no-fund

      - name: Llave del panel
        run: |
          node tools/prepare-key.js | tee key.log
          grep -q incluida key.log || echo "::notice::Compilado sin llave del panel: sin Autodemo, DNS ni registro del equipo (ver config/README.md)"

      - name: Revisar código (TypeScript) y pruebas
        run: |
          npm run typecheck
          npm test

      - name: Compilar la app (dist/)
        run: npm run build

      # VIDAA abre la app desde una dirección web: el .zip se descomprime en la carpeta vidaa/ del panel (junto a api/)
      - name: Empaquetar
        run: |
          mkdir -p out
          test -f dist/index.html && test -f dist/app.js && test -f dist/instalar.html
          (cd dist && zip -qr ../out/MPXPlayer-VIDAA.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: MPXPlayer-VIDAA
          path: out/*

      # publica siempre la última versión en la misma dirección de descarga (Releases > vidaa-latest)
      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum MPXPlayer-VIDAA.zip > SHA256SUMS.txt
          gh release delete vidaa-latest --yes --cleanup-tag || true
          gh release create vidaa-latest MPXPlayer-VIDAA.zip SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease \
            --title "MPX Player Hisense Smart TV · VIDAA OS (última versión)" \
            --notes "Compilado automáticamente desde la rama vidaaOS ($GITHUB_SHA). Se descomprime en la carpeta vidaa/ del panel (junto a api/) y se abre en el televisor con http://TU-PANEL/vidaa/ (ver el README de la rama vidaaOS)."
