schema-version = 1

[package]
id = "com.latmpx.player.vega"
title = "MPX Player"
version = "1.0.8"
icon = "@image/app_icon.png"

[os.version]
min = "1.2"
target = "1.2"

[components]
[[components.interactive]]
id = "com.latmpx.player.vega.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
categories = ["com.amazon.category.main"]
launch-type = "singleton"

[processes]
[[processes.group]]
id = "main"
component-ids = ["com.latmpx.player.vega.main"]

[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.inputd.service"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.module]]
id = "/com.latmpx.player.vega.main@IMod1"
includes-messages = ["pkg://com.latmpx.player.vega.main"]

[[message]]
uri = "pkg://com.latmpx.player.vega.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]
