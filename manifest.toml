schema-version = 1

[package]
id = "com.latmpx.player.tv"
title = "MPX Player"
version = "2.1.3"
icon = "@image/app_icon.png"

# Vega OS 2.0 (SDK 2.0): el reproductor de Vega abre direcciones http en modo directo (canales .ts y películas, como
# LG y Android) solo en 2.0, según Amazon. min 1.2: sigue instalándose en los equipos que todavía no se actualizaron.
# Desde el SDK 2.0 la compilación arma sola los módulos /com.amazon.vega.os@IVega_* a partir de estas dos versiones
[os.version]
min = "1.2"
target = "2.0"

[components]
[[components.interactive]]
id = "com.latmpx.player.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
categories = ["com.amazon.category.main"]
launch-type = "singleton"

[processes]
[[processes.group]]
id = "main"
component-ids = ["com.latmpx.player.tv.main"]

[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

[[wants.service]]
id = "com.amazon.inputd.service"

[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

[offers]
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.module]]
id = "/com.latmpx.player.tv.main@IMod1"
includes-messages = ["pkg://com.latmpx.player.tv.main"]

[[message]]
uri = "pkg://com.latmpx.player.tv.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]

# servidores IPTV por http en el modo directo del reproductor de Vega (Vega OS 2.0, según Amazon en su foro de
# desarrolladores): sin esto el reproductor rechaza la dirección («insecure protocol/scheme http», error 4)
[network-traffic-policy.cleartext]
allowed-domains = ["*"]
